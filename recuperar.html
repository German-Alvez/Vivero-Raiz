
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Vivero Raíz</title>

    <link rel="stylesheet" href="recuperar.css">
     <script src="recuperar.js" defer></script>
</head>

<body>

    <main class="contenedor-recuperar">

        <section class="tarjeta-recuperar">

            <img src="img/Gemini_Generated_Image_n17u9tn17u9tn17u.jpg"
                 alt="Logo Vivero Raíz">

            <h1>¿Olvidaste tu contraseña?</h1>

            <p class="descripcion">
                No te preocupes. Ingresá tu correo electrónico y te
                enviaremos las instrucciones para recuperar tu contraseña.
            </p>

            <form id="form-recuperar">

                <label for="correo">CORREO ELECTRÓNICO</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresá tu correo electrónico"
                    required
                >

                <p id="mensaje-error"></p>
                <p id="mensaje-exito"></p>

                <button type="submit">RECUPERAR CONTRASEÑA</button>

            </form>

            <a href="login.html" class="volver">Volver al inicio de sesión</a>

        </section>

    </main>


</body>
</html>
